[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisim"
dynamic = ["version"]
description = "A simulation benchmark tool for hicache"
dependencies = [
    "numpy",
    "scikit-learn",
    "xgboost",
    "aiconfigurator @ file:///data/tair-kvcache/aiconfigurator"
]